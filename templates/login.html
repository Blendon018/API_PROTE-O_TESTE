<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Security</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:Arial, Helvetica, sans-serif;
            background:#0f172a;
            position:relative;
        }

        /* FUNDO ANIMADO */

        .background{
            position:absolute;
            width:100%;
            height:100%;
            overflow:hidden;
            z-index:0;
        }

        .square{
            position:absolute;
            width:120px;
            height:120px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            animation: float 12s infinite linear;
            transition:0.5s;
        }

        .square:hover{
            transform:scale(1.3) rotate(20deg);
            background:rgba(0,255,200,0.2);
        }

        .square:nth-child(1){
            top:10%;
            left:10%;
            animation-duration:14s;
        }

        .square:nth-child(2){
            top:70%;
            left:20%;
            animation-duration:18s;
        }

        .square:nth-child(3){
            top:40%;
            left:80%;
            animation-duration:20s;
        }

        .square:nth-child(4){
            top:15%;
            left:70%;
            animation-duration:16s;
        }

        .square:nth-child(5){
            top:80%;
            left:75%;
            animation-duration:22s;
        }

        @keyframes float{

            0%{
                transform:translateY(0px) rotate(0deg);
            }

            50%{
                transform:translateY(-40px) rotate(180deg);
            }

            100%{
                transform:translateY(0px) rotate(360deg);
            }

        }

        /* LOGIN */

        .login-box{

            position:relative;
            z-index:2;

            width:350px;

            padding:40px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border:1px solid rgba(255,255,255,0.1);

            box-shadow:0 0 25px rgba(0,0,0,0.4);

            transition:0.4s;
        }

        .login-box:hover{

            transform:translateY(-5px);

            box-shadow:0 0 40px rgba(0,255,200,0.3);
        }

        h1{

            color:white;

            text-align:center;

            margin-bottom:30px;

            letter-spacing:2px;
        }

        input{

            width:100%;

            padding:15px;

            margin-top:15px;

            border:none;

            border-radius:10px;

            outline:none;

            background:rgba(255,255,255,0.1);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        input:focus{

            background:rgba(255,255,255,0.2);

            box-shadow:0 0 10px rgba(0,255,200,0.5);
        }

        input::placeholder{
            color:#ccc;
        }

        button{

            width:100%;

            padding:15px;

            margin-top:25px;

            border:none;

            border-radius:10px;

            background:#00b894;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.03);

            background:#00d1a7;

            box-shadow:0 0 20px rgba(0,255,200,0.6);
        }

        .security{

            text-align:center;

            margin-top:20px;

            color:#aaa;

            font-size:12px;
        }

    </style>

</head>

<body>

    <!-- FUNDO -->

    <div class="background">

        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>

    </div>

    <!-- LOGIN -->

    <div class="login-box">

        <h1>SECURITY LOGIN</h1>

        <form action="/login" method="POST">

            <input
                type="text"
                name="login"
                placeholder="Usuário"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="security">
            Firewall Protection Active
        </div>

    </div>

</body>
</html>
